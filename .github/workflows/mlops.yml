name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache Pip Packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx flake8

    - name: Lint Code with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run DVC Reproduce
      env:
        MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      run: dvc repro

    - name: Run Unit Tests
      run: python -m pytest tests/ -v

    - name: Package deploy zip
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        mkdir -p deploy_pkg/models deploy_pkg/data/processed deploy_pkg/reports deploy_pkg/src
        cp requirements-serve.txt deploy_pkg/requirements.txt
        cp setup.py params.yaml deploy_pkg/ 2>/dev/null || true
        cp -r src deploy_pkg/
        cp models/model.pkl deploy_pkg/models/
        if [ -f data/processed/train_processed_mean.csv ]; then
          cp data/processed/train_processed_mean.csv deploy_pkg/data/processed/
        fi
        if [ -f reports/metrics.json ]; then
          cp reports/metrics.json deploy_pkg/reports/
        fi
        if [ -f reports/mlflow_run_id.txt ]; then
          cp reports/mlflow_run_id.txt deploy_pkg/reports/
        fi
        cd deploy_pkg && zip -r ../deploy.zip .
      # zip is used by webapps-deploy

    - name: Upload deploy zip
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: actions/upload-artifact@v4
      with:
        name: deploy-zip
        path: deploy.zip
        retention-days: 3

  deploy:
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
    - name: Download deploy zip
      uses: actions/download-artifact@v4
      with:
        name: deploy-zip

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: deploy.zip
